<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/">
    <script>
        // 嚴格前置路由守衛：在下載任何業務資源之前，先檢查本地登入憑證；未登入者立即踢回門戶頁
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get("code")) return;
            var token = localStorage.getItem("loa_boss_auth_token") || localStorage.getItem("loa_boss_auth_jwt");
            if (!token) {
                window.location.replace("/");
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LOA-BOSS監控</title>
    <link rel="stylesheet" href="./static/css/bossTooltip.css?v=20261015_sheet3">
    <link rel="stylesheet" href="./static/css/auth.css?v=20261015_v5">
    <link rel="icon" type="image/png" href="./icon/favicon.ico">
    <link rel="stylesheet" href="./static/css/main.css?v=20261016_msgsheet">
    <script type="text/javascript" src="./static/config.js?v=20261015_no_weekly"></script>
    <script type="text/javascript" src="./static/auth.js?v=20261017_ws_only"></script>
    <script type="text/javascript" src="./static/onlineUsers.js?v=20261017_ws_only"></script>
    <script type="text/javascript" src="./static/init.js?v=20261017_no_ext"></script>
    <script type="text/javascript" src="./static/save.js?v=1"></script>
    <script type="text/javascript" src="./static/db.js"></script>
    <script type="text/javascript" src="./static/tablefunc.js"></script>
    <script type="text/javascript" src="./static/bossList.js?v=20261017_categories"></script>
    <script type="text/javascript" src="./static/bossTooltip.js?v=20261017_retention60"></script>
    <script type="text/javascript" src="./static/dashboard.js?v=20261017_no_ext"></script>
    <script type="text/javascript" src="./static/messageListen.js?v=20261017_ws_only"></script>
    <script type="text/javascript" src="./static/onLoading.js?v=20261017_ws_only"></script>
    <script type="text/javascript" src="./static/dragonGate.js?v=20261015_mobile"></script>
    <script type="text/javascript" src="./static/wsClient.js?v=20261017_ws_only"></script>


</head>

<body>
    <!-- 主系統業務容器（已通過登入閘道驗證） -->
    <div id="mainAppContent" class="main-app-content">
        <!-- 右上角使用者身分元件 -->
        <div id="discordUserStatusWidget">
            <img id="discordUserAvatar" class="discord-avatar-img" src="" alt="avatar">
            <span id="discordUserName" style="font-weight: 600;"></span>
            <span style="color: #43b581; font-size: 11px;">(已驗證)</span>
            <span id="discordLogoutBtn" class="discord-logout-link">登出</span>
        </div>

        <div class="flex-container">
            <div id="dragonGateStatusContainer">
                <h4>🐉 龍門<span class="dg-title-rest">狀態追蹤</span></h4>
                <div id="dragonGateStatusDisplay"></div>
            </div>
        </div>
        <div id="reboot_message"></div>
        <div id="filterButtons">
            <button data-boss-name="" class="active">顯示全部</button>
            <button id="trackBossNamesBtn">追蹤清單</button>
        </div>
        <div class="table-scroll-wrapper">
            <table id="bossList">
                <tbody>
                </tbody>
            </table>
        </div>
        <!-- 訊息區：桌面版為底部固定區塊；手機版為可下拉關閉的底部抽屜 -->
        <div id="messageSheet" class="msg-sheet">
            <div class="msg-backdrop"></div>
            <div class="msg-panel" role="dialog" aria-label="訊息紀錄">
                <div class="msg-grab">
                    <div class="msg-handle"></div>
                    <div class="msg-header">
                        <div class="msg-title">訊息紀錄</div>
                        <button class="msg-close" aria-label="關閉">✕</button>
                    </div>
                </div>
                <div class="message-container" id="messageContainer" style="display:block;"></div>
            </div>
        </div>
        <div id="setting_container">
            <button id="toggleMessageContainer" style="width: 80px;">顯示訊息</button><br>
            <button id="toggleVolumeBtn">🔊 <span id="volumeBtnLabel">50%</span></button>
            <div id="volumeControl">
                <span>音量:</span><span id="percentageDisplay">50%</span><br>
                <input type="range" id="percentageSlider" min="0" max="100" step="1" value="50" style="width: 80px;">
            </div>
            <span id="versionSpan">ver251027</span>
        </div>

        <div class="floating-message" id="floatingMessage">
            This is a floating message!
        </div>

        <div id="tts-overlay" style="
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            color: white; 
            z-index: 9999; 
            text-align: center; 
            padding-top: 20vh;
        ">
            <h2>偵測到行動裝置，請點擊啟動語音</h2>
            <p>行動裝置需先點擊才能啟用自動語音播報。</p>
            <button id="tts-unlock-button" style="
                padding: 15px 30px; 
                font-size: 1.2em; 
                cursor: pointer; 
                background-color: #4CAF50; 
                color: white; 
                border: none; 
                border-radius: 5px;
            ">
                啟動播報
            </button>
        </div>
    </div>
</body>

</html>
