name = "loa-boss-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 啟用 Durable Objects 來管理 WebSocket 連線與即時狀態廣播
[durable_objects]
bindings = [
  { name = "BOSS_ROOM", class_name = "BossRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BossRoom"]

# 輪迴刷新由 BossRoom 的 Durable Object Alarm 於每個整點檢查，不需 Cron Trigger。
#
# Discord Webhook 一律以 secret 設定 (切勿寫進程式碼或本檔)：
#   wrangler secret put DISCORD_WEBHOOK_ELDER
#   wrangler secret put DISCORD_WEBHOOK_TOWER
#   wrangler secret put DISCORD_WEBHOOK_CAMP
#   wrangler secret put DISCORD_WEBHOOK_WILD
#   wrangler secret put DISCORD_WEBHOOK_ALL
