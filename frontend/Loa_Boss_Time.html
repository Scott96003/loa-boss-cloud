<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/">
    <script>
        // 嚴格前置路由守衛：在下載任何業務資源之前，先檢查本地登入憑證；未登入者立即踢回門戶頁
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get("code")) return;
            var token = localStorage.getItem("loa_boss_auth_token") || localStorage.getItem("loa_boss_auth_jwt");
            if (!token) {
                window.location.replace("/");
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LOA-BOSS監控</title>
    <link rel="stylesheet" href="./static/css/bossTooltip.css">
    <link rel="stylesheet" href="./static/css/auth.css?v=20261015_v5">
    <link rel="icon" type="image/png" href="./icon/favicon.ico">
    <link rel="stylesheet" href="./static/css/main.css?v=20261015_dragonbar">
    <script type="text/javascript" src="./static/config.js?v=20261015_dragon_worker"></script>
    <script type="text/javascript" src="./static/auth.js?v=20261015_presence_fix"></script>
    <script type="text/javascript" src="./static/onlineUsers.js?v=20261015_ui"></script>
    <script type="text/javascript" src="./static/init.js?v=20261015_mobile"></script>
    <script type="text/javascript" src="./static/save.js?v=1"></script>
    <script type="text/javascript" src="./static/db.js"></script>
    <script type="text/javascript" src="./static/tablefunc.js"></script>
    <script type="text/javascript" src="./static/bossList.js"></script>
    <script type="text/javascript" src="./static/bossTooltip.js"></script>
    <script type="text/javascript" src="./static/dashboard.js?v=20261015_mobile"></script>
    <script type="text/javascript" src="./static/messageListen.js?v=20261015_dup_msg_fix"></script>
    <script type="text/javascript" src="./static/sendMessageToDiscord.js?v=20261015_death_fix"></script>
    <script type="text/javascript" src="./static/onLoading.js?v=20261015_mobile"></script>
    <script type="text/javascript" src="./static/dragonGate.js?v=20261015_mobile"></script>
    <script type="text/javascript" src="./static/webrtc/webrtc.js?v=20261015_presence_status"></script>
    <script type="text/javascript" src="./static/webrtc/webrtc_client.js?v=20261015_review_fix"></script>


</head>

<body>
    <!-- 主系統業務容器（已通過登入閘道驗證） -->
    <div id="mainAppContent" class="main-app-content">
        <!-- 右上角使用者身分元件 -->
        <div id="discordUserStatusWidget">
            <img id="discordUserAvatar" class="discord-avatar-img" src="" alt="avatar">
            <span id="discordUserName" style="font-weight: 600;"></span>
            <span style="color: #43b581; font-size: 11px;">(已驗證)</span>
            <span id="discordLogoutBtn" class="discord-logout-link">登出</span>
        </div>

        <div class="flex-container">
            <div id="setting_div" class="hidden">
                <input type="number" id="bossid" placeholder="bossID">
                <input type="text" id="bossName" placeholder="頭目名稱">
                <input type="number" id="respawnTime" placeholder="重生時間(小時)">
                <br>
                <button id="btn_addToBossList">新增</button>
                <button id="btn_resetData">重置預設</button>
                <button id="btn_saveToDB">儲存資料</button>
                <br>
                <button id="btn_refresh">重整</button>
                <div class="boss-legend">
                    <span style="color: var(--boss顏色-25)">重生已過1/4 </span>
                    <span style="color: var(--boss顏色-50)">重生已過1/2 </span>
                    <span style="color: var(--boss顏色-75)"> 重生已過3/4 </span>
                    <span style="color: var(--boss顏色-90)"> 重生已過9/10 </span>
                </div>
            </div>

            <div id="dragonGateStatusContainer">
                <h4>🐉 龍門<span class="dg-title-rest">狀態追蹤</span></h4>
                <div id="dragonGateStatusDisplay"></div>
            </div>
            <div id="webrtc_div" style="display: none;">
            </div>
        </div>
        <div id="reboot_message"></div>
        <div id="filterButtons">
            <button data-boss-name="" class="active">顯示全部</button>
            <button data-boss-name="1,2,91202,91605,91516">三大龍</button>
            <button data-boss-name="45955,45956,45957,45958,45959,45960,45961,45962">魂塔長老</button>
            <button data-boss-name="81082,45685,45674,45625,45753">陣營Boss</button>
            <button data-boss-name="45513,45547,45606,45650,45652,45653,45654,45618,45672,45673,46220,46271">傲慢之塔</button>

            <button data-boss-name="45614,45601,45617,,45600,99513,45545,45488,45678,45680">野外重要Boss</button>
            <button
                data-boss-name="45955,45956,45957,45958,45959,45960,45961,45962,81082,45685,45674,45625,45753,45672,45673,45618,45653,45614,45801,46142,46141,99085,99086,99065,45863,45649">重點必須拿下</button>
            <button id="trackBossNamesBtn">追蹤清單</button>
        </div>
        <div class="table-scroll-wrapper">
            <table id="bossList">
                <tbody>
                </tbody>
            </table>
        </div>
        <div class="message-container" id="messageContainer" style="display:block;"></div>
        <div id="setting_container">
            <button id="toggleMessageContainer" style="width: 80px;">顯示訊息</button><br>
            <button id="toggleSettingContainer" style="width: 80px;">設定</button><br>
            <button id="toggleVolumeBtn">🔊 <span id="volumeBtnLabel">50%</span></button>
            <div id="volumeControl">
                <span>音量:</span><span id="percentageDisplay">50%</span><br>
                <input type="range" id="percentageSlider" min="0" max="100" step="1" value="50" style="width: 80px;">
            </div>
            <span id="versionSpan">ver251027</span>
        </div>

        <div class="floating-message" id="floatingMessage">
            This is a floating message!
        </div>

        <div id="tts-overlay" style="
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            color: white; 
            z-index: 9999; 
            text-align: center; 
            padding-top: 20vh;
        ">
            <h2>偵測到行動裝置，請點擊啟動語音</h2>
            <p>行動裝置需先點擊才能啟用自動語音播報。</p>
            <button id="tts-unlock-button" style="
                padding: 15px 30px; 
                font-size: 1.2em; 
                cursor: pointer; 
                background-color: #4CAF50; 
                color: white; 
                border: none; 
                border-radius: 5px;
            ">
                啟動播報
            </button>
        </div>
    </div>
</body>

</html>
