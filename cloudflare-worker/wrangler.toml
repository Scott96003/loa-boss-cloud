name = "loa-boss-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 啟用 Durable Objects 來管理 WebSocket 連線與即時狀態廣播
[durable_objects]
bindings = [
  { name = "BOSS_ROOM", class_name = "BossRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BossRoom"]

# BossRoom 的 Durable Object Alarm 於長老換區段與龍門關閉時喚醒並推送通知，不需 Cron Trigger。
#
# Discord Webhook 一律以 secret 設定 (切勿寫進程式碼或本檔)：
#   wrangler secret put DISCORD_WEBHOOK_ELDER    (魂塔長老擊殺與區段更新通知)
#   wrangler secret put DISCORD_WEBHOOK_DRAGON   (龍門開啟／關閉通知)
